name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Descomprimir
        run: |
          for z in *.zip *.ZIP ats-*.zip; do [ -f "$z" ] && unzip -o "$z"; done
          for d in */; do [ -f "$d/app/build.gradle" ] && cp -r "$d"/*. 2>/dev/null; cp -r "$d"/. 2>/dev/null || true; done
          ls -la
          ls -la app

      - name: Arreglar Gradle raiz
        run: |
          # settings.gradle SIMPLE para proyectos viejos
          echo "include ':app'" > settings.gradle
          # build.gradle raiz con google() + classpath
          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          cat settings.gradle
          cat build.gradle
          echo "--- app/build.gradle primeros 30 ---"
          head -n 50 app/build.gradle

      - run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app/build/outputs/apk/debug/*.apk          EOF
          cat settings.gradle
          ls -la app

      - run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app/build/outputs/apk/debug/*.apk
