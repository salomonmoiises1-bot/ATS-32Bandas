name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Descomprimir
        run: |
          for z in *.zip *.ZIP; do [ -f "$z" ] && unzip -o "$z"; done
          ls -la

      - name: Arreglar Gradle raiz
        run: |
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jcenter.bintray.com" }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jcenter.bintray.com" }
                  maven { url "https://jitpack.io" }
              }
          }
          EOF

      - name: BORRAR ListenableFuture roto y parchar
        run: |
          echo "=== Antes ==="
          grep -n "ListenableFuture" app/build.gradle || echo "no grep"
          # Borra la linea que causa el error
          sed -i '/ListenableFuture/d' app/build.gradle
          sed -i '/com.google.common.util.concurrent/d' app/build.gradle
          echo "=== Despues ==="
          grep -n "ListenableFuture" app/build.gradle || echo "borrado OK"
          # Agrega el reemplazo oficial de Google
          cat >> app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  dependencySubstitution {
                      substitute module('com.google.common.util.concurrent:ListenableFuture') with module('com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava')
                  }
                  force 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
              }
          }
          EOF
          echo "implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'" >> app/build.gradle
          tail -n 30 app/build.gradle

      - run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app/build/outputs/apk/debug/*.apk
