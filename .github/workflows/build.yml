name: Build SJBStudio EQ32 Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare signing key
        env:
          EQ32_KEYSTORE_BASE64: ${{ secrets.EQ32_KEYSTORE_BASE64 }}
        run: |
          test -n "$EQ32_KEYSTORE_BASE64"
          echo "$EQ32_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eq32-release.jks"
          test -s "$RUNNER_TEMP/eq32-release.jks"

      - name: Sign Release APK
        env:
          EQ32_KEYSTORE_PASSWORD: ${{ secrets.EQ32_KEYSTORE_PASSWORD }}
          EQ32_KEY_ALIAS: ${{ secrets.EQ32_KEY_ALIAS }}
          EQ32_KEY_PASSWORD: ${{ secrets.EQ32_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          INPUT="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/eq32-release-aligned.apk"
          OUTPUT="app/build/outputs/apk/release/SJBStudio-EQ32-Release.apk"

          test -f "$INPUT"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          test -n "$EQ32_KEYSTORE_PASSWORD"
          test -n "$EQ32_KEY_ALIAS"
          test -n "$EQ32_KEY_PASSWORD"

          "$ZIPALIGN" -f -p 4 "$INPUT" "$ALIGNED"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/eq32-release.jks" \
            --ks-key-alias "$EQ32_KEY_ALIAS" \
            --ks-pass env:EQ32_KEYSTORE_PASSWORD \
            --key-pass env:EQ32_KEY_PASSWORD \
            --out "$OUTPUT" \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose "$OUTPUT"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SJBStudio-EQ32-Release-Signed
          path: app/build/outputs/apk/release/SJBStudio-EQ32-Release.apk
          if-no-files-found: error
          retention-days: 14
