name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Descomprimir y arreglar carpeta doble
        run: |
          for z in *.zip *.ZIP; do [ -f "$z" ] && unzip -o "$z"; done
          echo "Buscando proyecto real..."
          REAL_APP=$(find. -type f -path "*/app/src/main/AndroidManifest.xml" | head -n 1)
          echo "REAL_APP=$REAL_APP"
          REAL_ROOT=$(dirname $(dirname $(dirname $(dirname "$REAL_APP"))))
          echo "REAL_ROOT=$REAL_ROOT"
          if [ "$REAL_ROOT"!= "." ]; then
            echo "Moviendo de $REAL_ROOT a la raiz"
            cp -r $REAL_ROOT/*.
            cp -r $REAL_ROOT/.*. 2>/dev/null || true
          fi
          ls -la
          ls -la app/src/main/res/mipmap || echo "no mipmap"
          ls -la app/src/main/res/xml || echo "no xml"

      - name: Arreglar Gradle raiz
        run: |
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jcenter.bintray.com" }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jcenter.bintray.com" }
                  maven { url "https://jitpack.io" }
              }
          }
          EOF

      - name: Fix recursos faltantes + ListenableFuture
        run: |
          # Borra dependencia rota
          sed -i '/ListenableFuture/d' app/build.gradle
          sed -i '/com.google.common.util.concurrent/d' app/build.gradle

          # Crea iconos si no existen
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/xml
          if [! -f app/src/main/res/mipmap/ic_launcher.png ]; then
            echo "Creando ic_launcher dummy"
            # png de 1x1 transparente
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/w8AAwMB/6XW2LEAAAAASUVORK5CYII=" | base64 -d > app/src/main/res/mipmap/ic_launcher.png
            cp app/src/main/res/mipmap/ic_launcher.png app/src/main/res/mipmap/ic_launcher_round.png
          fi
          # Crea los xml que te faltan si no existen
          if [! -f app/src/main/res/xml/data_extraction_rules.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup><include domain="sharedpref" /><include domain="database" /></cloud-backup><device-transfer><include domain="sharedpref" /><include domain="database" /></device-transfer></data-extraction-rules>' > app/src/main/res/xml/data_extraction_rules.xml
          fi
          if [! -f app/src/main/res/xml/backup_rules.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><full-backup-content><include domain="sharedpref" /><include domain="database" /></full-backup-content>' > app/src/main/res/xml/backup_rules.xml
          fi

          # Parche ListenableFuture
          cat >> app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  dependencySubstitution {
                      substitute module('com.google.common.util.concurrent:ListenableFuture') using module('com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava')
                  }
                  force 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
              }
          }
          EOF
          echo "implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'" >> app/build.gradle

      - run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app/build/outputs/apk/debug/*.apk
