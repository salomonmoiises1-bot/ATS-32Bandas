name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o "*.zip" || true
          rm -f *.zip || true
          if [ -d "ats-audioplayer-and-mdrc-audio-effects" ]; then
            mv ats-audioplayer-and-mdrc-audio-effects/*. || true
            mv ats-audioplayer-and-mdrc-audio-effects/.*. || true
            rm -rf ats-audioplayer-and-mdrc-audio-effects
          fi
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          chmod +x gradlew
         ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ATS-32Bandas-APK
          path: app/build/outputs/apk/debug/app-debug.apk
