name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Descomprimir
        run: |
          for z in *.zip *.ZIP; do [ -f "$z" ] && unzip -o "$z"; done
          ls -la
          # Si el proyecto quedó en subcarpeta ATS-32Bandas/ATS-32Bandas, lo sacamos a la raiz
          if [! -f app/build.gradle ]; then
            echo "Buscando app/build.gradle en subcarpetas..."
            FOUND=$(find. -name "build.gradle" -path "*/app/build.gradle" | head -n 1)
            echo "Encontrado: $FOUND"
            DIR=$(dirname $(dirname "$FOUND"))
            echo "Moviendo desde $DIR a./"
            cp -r "$DIR"/*./
            cp -r "$DIR"/.*./ 2>/dev/null || true
          fi
          ls -la
          ls -la app

      - name: Arreglar Gradle raiz
        run: |
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jcenter.bintray.com" }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jcenter.bintray.com" }
                  maven { url "https://jitpack.io" }
              }
          }
          EOF

      - name: Fix ListenableFuture
        run: |
          sed -i '/ListenableFuture/d' app/build.gradle
          sed -i '/com.google.common.util.concurrent/d' app/build.gradle
          cat >> app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  dependencySubstitution {
                      substitute module('com.google.common.util.concurrent:ListenableFuture') using module('com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava')
                  }
              }
          }
          dependencies {
              implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
          }
          EOF
          tail -n 40 app/build.gradle

      - run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app/build/outputs/apk/debug/*.apk
